
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxora</title>
  <style>
    body {
      margin: 0;
      background-color: #0e0e0e;
      font-family: 'Segoe UI', sans-serif;
      color: silver;
    }
    .background-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      font-size: 10rem;
      transform: translate(-50%, -50%);
      color: rgba(192,192,192,0.05);
      z-index: 0;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      padding: 40px;
      z-index: 1;
      position: relative;
    }
    .box {
      background-color: #1a1a1a;
      border: 2px solid silver;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    h1 {
      text-align: center;
      padding-top: 20px;
      color: silver;
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <div class="background-logo">LUXORA</div>
  <h1>Collection Numérique</h1>
  <div class="grid">
    <div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
<div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
<div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
<div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
<div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
<div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
<div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
<div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
<div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
<div class="box"><model-viewer src="model.glb" alt="Vêtement 3D" auto-rotate camera-controls background-color="#000000"></model-viewer></div>
  </div>
</body>
</html>
